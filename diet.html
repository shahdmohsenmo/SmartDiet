<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Diet Plan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Create Your Diet Plan</h1>

        <form id="dietForm">
            <label>Name:</label>
            <input type="text" id="name" required>

            <label>Age:</label>
            <input type="number" id="age" required>

            <label>Gender:</label>
            <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Height (cm):</label>
            <input type="number" id="height" required>

            <label>Weight (kg):</label>
            <input type="number" id="weight" required>

            <label>Daily Activity Level:</label>
            <select id="activity">
                <option value="1.2">Low</option>
                <option value="1.375">Medium</option>
                <option value="1.55">High</option>
            </select>

            <label>Your Goal:</label>
            <select id="goal">
                <option value="lose">Lose Weight</option>
                <option value="maintain">Maintain Weight</option>
                <option value="gain">Gain Weight</option>
            </select>

            <label>Food Allergies (write anything you can't eat):</label>
            <input type="text" id="allergy" placeholder="e.g., milk, eggs, peanuts">

            <button type="submit">Generate My Plan</button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script src="diet.js"></script>
</body>
</html>
