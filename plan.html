<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Your Plan — SmartDiet</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .plan-header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      background: linear-gradient(135deg, #2e8b57, #4caf50);
      border-radius: 20px;
      color: white;
    }

    .plan-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #2e8b57;
      margin: 10px 0;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .meal-card {
      background: linear-gradient(135deg, #ffffff, #f8fff8);
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      border-left: 5px solid #4caf50;
      transition: all 0.3s ease;
    }

    .meal-card:hover {
      transform: translateX(10px);
      box-shadow: 0 10px 25px rgba(46, 139, 87, 0.15);
    }

    .meal-time {
      font-weight: 600;
      color: #2e8b57;
      font-size: 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meal-details {
      margin: 15px 0;
    }

    .meal-nutrition {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .nutrition-badge {
      background: rgba(46, 139, 87, 0.1);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      color: #246b45;
    }

    .allergy-badge {
      background: rgba(244, 67, 54, 0.1);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
      color: #c62828;
    }

    .day-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin: 30px 0;
      padding-bottom: 10px;
    }

    .day-tab {
      padding: 15px 25px;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid #e0e0e0;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .day-tab.active {
      background: #2e8b57;
      color: white;
      border-color: #2e8b57;
    }

    .day-content {
      display: none;
    }

    .day-content.active {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    .allergy-alert {
      background: #ffebee;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      border-left: 4px solid #f44336;
    }

    .egg-free-banner {
      background: #e8f5e9;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      border-left: 4px solid #4caf50;
      text-align: center;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <div class="brand">Smart<span>Diet</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="profile.html">Create Profile</a>
      <a href="plan.html" class="active">My Plan</a>
      <a href="workout.html">Workout Plan</a>
      <a href="ai.html">AI Coach</a>
    </div>
  </nav>

  <main class="container">
    <div class="plan-header">
      <h1 style="color: white; margin-bottom: 10px;"> Your 7-Day Smart Diet Plan</h1>
      <p style="color: rgba(255,255,255,0.9);">Personalized nutrition with allergy safety guaranteed</p>
    </div>

    <div id="summary"></div>

    <!-- Allergy Warnings -->
    <div id="allergyWarnings"></div>

    <div class="plan-stats" id="planStats"></div>

    <div class="day-tabs" id="dayTabs"></div>

    <div id="dayContents"></div>

    <div
      style="margin-top: 50px; text-align: center; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
      <button onclick="location.href='profile.html'" class="btn ghost">✏️ Edit Profile</button>
      <button onclick="exportPlanPDF()" class="btn">📥 Export as PDF</button>
      <button onclick="clearPlan()" class="btn ghost">🗑️ Clear Plan</button>
      <a href="workout.html" class="btn" style="background: linear-gradient(135deg, #ff9800, #f57c00);">💪 View Workout
        Plan</a>
      <a href="ai.html" class="btn" style="background: linear-gradient(135deg, #2196f3, #1976d2);">🤖 Ask AI Coach</a>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const raw = localStorage.getItem('smartdiet_plan');
      if (!raw) {
        document.querySelector('.plan-header').innerHTML = `
          <h2 style="color: white;">🌟 No Plan Found</h2>
          <p style="color: rgba(255,255,255,0.9);">Create your personalized plan to get started!</p>
          <a href="profile.html" class="btn" style="margin-top: 20px; background: white; color: #2e8b57;">Create My Plan</a>
        `;
        return;
      }

      try {
        const plan = JSON.parse(raw);
        renderPlan(plan);
      } catch (e) {
        document.getElementById('summary').innerHTML = `
          <div style="color: #e53935; padding: 20px; background: #ffebee; border-radius: 10px;">
            Error loading plan. Please recreate.
          </div>
        `;
      }
    });

    function renderPlan(plan) {
      const profile = plan.profile;
      const allergies = profile.allergy || '';

      // Render summary
      document.getElementById('summary').innerHTML = `
        <div style="display: flex; gap: 30px; align-items: center; flex-wrap: wrap; justify-content: space-between;">
          <div style="flex: 1;">
            <h3 style="color: #2e8b57; margin-bottom: 15px;">👤 Personal Profile</h3>
            <p><strong>Name:</strong> ${profile.name}</p>
            <p><strong>Age/Gender:</strong> ${profile.age} years, ${profile.gender}</p>
            <p><strong>Height/Weight:</strong> ${profile.height}cm, ${profile.weight}kg</p>
            <p><strong>Primary Goal:</strong> ${profile.goal === 'lose' ? 'Weight Loss' : profile.goal === 'gain' ? 'Muscle Gain' : 'Maintenance'}</p>
            <p><strong>Diet Preference:</strong> ${profile.preference}</p>
            ${profile.healthCondition ? `<p><strong>Health Consideration:</strong> ${profile.healthCondition}</p>` : ''}
            ${allergies ? `<p><strong>Allergies:</strong> ${allergies}</p>` : ''}
          </div>
          <div style="text-align: center;">
            <img src="images/BMI.png" alt="Nutrition" style="width: 400px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <p style="margin-top: 10px; font-size: 14px; color: #666;">Personalized Nutrition Chart</p>
          </div>
        </div>
      `;

      // Render allergy warnings
      const warningsContainer = document.getElementById('allergyWarnings');
      if (allergies) {
        let warningHTML = '';
        const allergyList = allergies.toLowerCase();

        if (allergyList.includes('egg')) {
          warningHTML += `
            <div class="egg-free-banner">
              <h3 style="color: #2e7d32; margin: 0;">✅ EGG-FREE PLAN GUARANTEED</h3>
              <p style="margin: 10px 0 0 0; color: #1b5e20;">All meals are 100% free of egg products</p>
            </div>
          `;
        }

        warningHTML += `
          <div class="allergy-alert">
            <h3 style="color: #c62828; margin: 0 0 10px 0;">🛡️ Allergy Safety Active</h3>
            <p style="margin: 0;">The following allergens are strictly avoided: <strong>${allergies}</strong></p>
            <p style="margin: 10px 0 0 0; font-size: 14px; color: #666;">
              All meals have been verified safe. Always double-check ingredients when preparing.
            </p>
          </div>
        `;

        warningsContainer.innerHTML = warningHTML;
      }

      // Render stats
      document.getElementById('planStats').innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${plan.summary.calories}</div>
          <div class="stat-label">Daily Calories</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${plan.summary.proteinTarget}g</div>
          <div class="stat-label">Daily Protein</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${plan.summary.bmi}</div>
          <div class="stat-label">BMI (${plan.summary.bodyShape})</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${profile.mealsCount}</div>
          <div class="stat-label">Meals per Day</div>
        </div>
      `;

      // Render day tabs and contents
      const dayTabs = document.getElementById('dayTabs');
      const dayContents = document.getElementById('dayContents');

      plan.week.forEach((day, index) => {
        // Create tab
        const tab = document.createElement('div');
        tab.className = `day-tab ${index === 0 ? 'active' : ''}`;
        tab.textContent = day.day;
        tab.onclick = () => switchDay(index);
        dayTabs.appendChild(tab);

        // Create content
        const content = document.createElement('div');
        content.className = `day-content ${index === 0 ? 'active' : ''}`;
        content.id = `day-${index}`;
        content.innerHTML = renderDayContent(day, profile);
        dayContents.appendChild(content);
      });
    }

    function renderDayContent(day, profile) {
      let html = `<h2 style="color: #2e8b57; margin-bottom: 25px;">${day.day} - ${day.date || ''}</h2>`;
      html += `<p style="color: #666; margin-bottom: 20px;"><strong>Daily Total:</strong> ${day.totalCalories} kcal | ${day.totalProtein}g protein</p>`;

      // Render meals
      day.meals.forEach(meal => {
        html += `
          <div class="meal-card">
            <div class="meal-time">🕒 ${meal.time}
              ${meal.tags && meal.tags.includes('egg_free') ? `<span class="allergy-badge">✅ Egg-free</span>` : ''}
            </div>
            <div class="meal-details">
              <h4 style="margin: 0 0 10px 0; color: #333;">${meal.item}</h4>
              ${meal.description ? `<p style="color: #666; margin: 10px 0;">${meal.description}</p>` : ''}
              ${meal.ingredients && meal.ingredients.length > 0 ? `
                <p style="margin: 10px 0; font-size: 14px; color: #666;">
                  <strong>Ingredients:</strong> ${meal.ingredients.join(', ')}
                </p>
              ` : ''}
              ${meal.nutrition ? `
                <div class="meal-nutrition">
                  <span class="nutrition-badge">${meal.nutrition.calories} kcal</span>
                  <span class="nutrition-badge">${meal.nutrition.protein}g protein</span>
                  <span class="nutrition-badge">${meal.nutrition.carbs}g carbs</span>
                  <span class="nutrition-badge">${meal.nutrition.fat}g fat</span>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });

      // Render snacks
      if (day.extras && day.extras.length > 0) {
        html += `<h3 style="color: #666; margin: 30px 0 15px 0;">🥪 Snacks</h3>`;
        day.extras.forEach(extra => {
          html += `
            <div class="meal-card" style="border-left-color: #ff9800;">
              <div class="meal-time">${extra.time}</div>
              <div class="meal-details">
                <p style="margin: 0;">${extra.item}</p>
              </div>
            </div>
          `;
        });
      }

      // Add hydration reminder
      const waterNeeds = Math.round(profile.weight * 35);
      html += `
        <div style="background: #e8f5e9; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: center;">
          <p style="margin: 0; color: #2e7d32;">💧 Remember to drink ${waterNeeds}ml of water today!</p>
        </div>
      `;

      return html;
    }

    function switchDay(index) {
      // Update tabs
      document.querySelectorAll('.day-tab').forEach((tab, i) => {
        tab.classList.toggle('active', i === index);
      });

      // Update contents
      document.querySelectorAll('.day-content').forEach((content, i) => {
        content.classList.toggle('active', i === index);
      });
    }

    function exportPlanPDF() {
      const raw = localStorage.getItem('smartdiet_plan');
      if (!raw) {
        alert('No plan found to export!');
        return;
      }

      try {
        const plan = JSON.parse(raw);
        const result = exportPlanToPDF(plan);
        alert(result);
      } catch (e) {
        alert('Error generating PDF: ' + e.message);
      }
    }

    function clearPlan() {
      if (confirm('Clear your plan and profile?')) {
        localStorage.removeItem('smartdiet_profile');
        localStorage.removeItem('smartdiet_plan');
        location.href = 'index.html';
      }
    }
  </script>
</body>

</html>
